name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project if a zip was uploaded instead of raw files
        run: |
          shopt -s dotglob nullglob
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found $ZIP_FILE, extracting..."
            unzip -o "$ZIP_FILE" -d extracted_project
            TOPDIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$TOPDIR" ] && [ "$(find extracted_project -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
              mv "$TOPDIR"/* .
            else
              mv extracted_project/* .
            fi
            rm -rf extracted_project "$ZIP_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAssistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
